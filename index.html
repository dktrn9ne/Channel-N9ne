<!-- ✨ Stars Script -->
<script>
/* (same stars background logic — unchanged) */
const layers=[{id:'layer1',count:40,size:1,speed:.3},{id:'layer2',count:30,size:2,speed:.2},{id:'layer3',count:20,size:3,speed:.1}];
layers.forEach(l=>{
 const c=document.getElementById(l.id);
 for(let i=0;i<l.count;i++){
   const s=document.createElement('div');
   s.classList.add('star');
   s.style.width=`${l.size}px`;
   s.style.height=`${l.size}px`;
   s.style.left=`${Math.random()*100}vw`;
   s.style.top=`${Math.random()*100}vh`;
   const d=(Math.random()*10+10)/l.speed;
   const delay=Math.random()*20;
   s.style.animation=`fall ${d}s linear ${delay}s infinite`;
   c.appendChild(s);
 }
});
const style=document.createElement('style');
style.innerHTML=`@keyframes fall{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(100vh);opacity:.3;}}`;
document.head.appendChild(style);
</script>

<script>

);
const chatBox=document.getElementById('chat-box');
const usernameInput=document.getElementById('username');
const msgInput=document.getElementById('msg');
const sendBtn=document.getElementById('send');
const clientId=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).substring(2);

function formatTime(iso){
  const d=new Date(iso);
  return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function addMessage(m){
  const div=document.createElement('div');
  div.classList.add('msg');
  div.innerHTML=`<span class="user">${m.username}:</span> ${m.text}<span class="time">${formatTime(m.created_at)}</span>`;
  chatBox.appendChild(div);
  chatBox.scrollTop=chatBox.scrollHeight;
}
async function loadMessages(){
  const {data,error}=await db.from('messages').select('*').order('created_at',{ascending:true});
  if(error)return console.error(error);
  chatBox.innerHTML='';
  data.forEach(addMessage);
}
sendBtn.onclick=async()=>{
  const username=usernameInput.value.trim()||'Anon';
  const text=msgInput.value.trim();
  if(!text)return;
  await db.from('messages').insert([{username,text,client_id:clientId}]);
  msgInput.value='';
};
db.channel('public:messages')
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},
   p=>{if(p.new.client_id!==clientId)addMessage(p.new);})
 .subscribe();
loadMessages();
</script>

<!-- 🎥 Previous Streams Loader (fixed for string durations + modal) -->
<script>
async function loadArchives() {
  try {
    const res = await fetch('https://channeln9ne.xyz/api/get-mux-streams');
    if (!res.ok) throw new Error('Failed to load streams');
    let streams = await res.json();
    const container = document.getElementById('archive-carousel');
    container.innerHTML = '';

    if (!Array.isArray(streams) || !streams.length) {
      container.innerHTML = '<p style="color:#888">No past streams found.</p>';
      return;
    }

    // Sort newest first
    streams.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    streams.forEach(stream => {
      // Handle string or number durations
      let durationDisplay = '';
      if (typeof stream.duration === 'string') {
        durationDisplay = stream.duration;
      } else if (typeof stream.duration === 'number') {
        const mins = Math.floor(stream.duration / 60);
        const secs = Math.floor(stream.duration % 60).toString().padStart(2, '0');
        durationDisplay = `${mins}m ${secs}s`;
      } else {
        durationDisplay = '—';
      }

      const card = document.createElement('div');
      card.classList.add('archive-card');
      card.innerHTML = `
        <div style="position:relative;">
          <img src="${stream.thumbnail_url}" alt="${stream.title}" />
          <div style="
            position:absolute;
            bottom:8px;
            right:8px;
            background:rgba(0,0,0,0.6);
            color:#00ffff;
            padding:4px 8px;
            border-radius:6px;
            font-size:0.85em;
          ">▶ Watch Replay</div>
        </div>
        <div class="archive-meta">
          <span>${stream.title}</span>
        </div>
        <div class="archive-meta">
          <span class="duration-tag">${durationDisplay}</span>
          <span>👁️ ${stream.views}</span>
        </div>
      `;
      card.querySelector('img').addEventListener('click', () => openPlayback(stream.playback_id, stream.title));
      card.querySelector('div[style*="▶"]').addEventListener('click', () => openPlayback(stream.playback_id, stream.title));
      container.appendChild(card);
    });
  } catch (err) {
    console.error('Error loading streams:', err);
    document.getElementById('archive-carousel').innerHTML =
      '<p style="color:#f66">Error loading previous streams.</p>';
  }
}

function openPlayback(playbackId, title) {
  const modal = document.getElementById('playback-modal');
  const player = document.getElementById('archive-player');
  player.setAttribute('playback-id', playbackId);
  player.setAttribute('metadata-video-title', title);
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

document.getElementById('close-modal').addEventListener('click', () => {
  const modal = document.getElementById('playback-modal');
  const player = document.getElementById('archive-player');
  player.pause();
  modal.style.display = 'none';
  document.body.style.overflow = 'auto';
});

loadArchives();
</script>
