<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Channel N9NE Live</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      color: #fff;
      font-family: 'Arial', sans-serif;
      overflow-x: hidden;
    }

    #content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 5vh;
      min-height: 100vh;
    }

    #content img {
      width: 750px;
      max-width: 90vw;
      margin-bottom: 40px;
    }

    .mux-player-container {
      width: 80%;
      max-width: 960px;
      aspect-ratio: 16/9;
      border-radius: 10px;
      overflow: hidden;
    }

    /* Chat Styles */
    #chat {
      width: 80%;
      max-width: 960px;
      margin-top: 25px;
      border: 1px solid #333;
      border-radius: 10px;
      background: rgba(0,0,0,0.45);
      padding: 10px;
    }

    #chat-box {
      height: 320px;
      overflow-y: auto;
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    .msg { margin-bottom: 6px; line-height: 1.4; }
    .user { color: #00ffff; font-weight: bold; }
    .time { color: #777; font-size: 0.8em; margin-left: 5px; }

    #chat-inputs {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    input, button {
      border: none;
      border-radius: 5px;
      padding: 8px;
    }

    input {
      flex: 1;
      background: #111;
      color: #fff;
    }

    button {
      background: #00bfff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #00ffff; }
  </style>

  <!-- Mux Player -->
  <script src="https://unpkg.com/@mux/mux-player"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div id="content">
    <img src="channel9.png" alt="Channel N9NE Logo"/>

    <div class="mux-player-container">
      <mux-player
        stream-type="live"
        playback-id="Fl7MXxmxZz9NrkyXUUZAMnNSTS023JXzQfccTqnZ824Q"
        primary-color="#00bfff"
        metadata-video-title="Live Stream"
        autoplay
        muted>
      </mux-player>
    </div>

    <!-- 💬 Chat -->
    <div id="chat">
      <div id="chat-box"></div>
      <div id="chat-inputs">
        <input id="username" placeholder="Name" />
        <input id="msg" placeholder="Say something..." />
        <button id="send">Send</button>
      </div>
    </div>
  </div>

  <!-- Supabase Chat Logic -->
  <script>
    const { createClient } = supabase;

    // ⚠️ Replace with your project details
    const supabaseUrl = 'https://kidmxnxkhyhaehzexatm.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpZG14bnhraHloYWVoemV4YXRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5MTI3NjYsImV4cCI6MjA3NzQ4ODc2Nn0.JyyK2yYLP3WX4QIxnJcH_f4KNuDlaJ-e0ZKb07uJS_U';
    const db = createClient(supabaseUrl, supabaseKey);

    const chatBox = document.getElementById('chat-box');
    const usernameInput = document.getElementById('username');
    const msgInput = document.getElementById('msg');
    const sendBtn = document.getElementById('send');

    // Format timestamp
    function formatTime(iso) {
      const date = new Date(iso);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Add message to chat window
    function addMessage(msg) {
      const div = document.createElement('div');
      div.classList.add('msg');
      div.innerHTML =
        `<span class="user">${msg.username}:</span> ${msg.text} ` +
        `<span class="time">${formatTime(msg.created_at)}</span>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight; // auto-scroll
    }

    // Load existing messages
    async function loadMessages() {
      const { data, error } = await db
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Load error:', error);
        return;
      }
      chatBox.innerHTML = '';
      data.forEach(addMessage);
    }

    // Send new message
    sendBtn.onclick = async () => {
      const username = usernameInput.value.trim() || 'Anon';
      const text = msgInput.value.trim();
      if (!text) return;
      const { error } = await db.from('messages').insert([{ username, text }]);
      if (error) console.error('Insert error:', error);
      msgInput.value = '';
    };

    // Realtime subscription
    db.channel('public:messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' },
        payload => addMessage(payload.new))
      .subscribe();

    loadMessages();
  </script>
</body>
</html>
