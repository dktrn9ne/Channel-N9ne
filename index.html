<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Starry Background with Logo + Livestream</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      overflow-x: hidden;
      font-family: 'Arial', sans-serif;
    }

    .star-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    #content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 5vh;
      min-height: 100vh;
    }

    #content img {
      width: 750px;
      max-width: 90vw;
      height: auto;
      margin-bottom: 40px;
    }

    .mux-player-container {
      width: 80%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      position: relative;
      z-index: 10;
    }

    mux-player {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
    }

    /* Chat styles */
    .chat-container {
      width: 80%;
      max-width: 960px;
      margin: 40px auto 80px;
      padding: 20px;
      background: rgba(9, 10, 15, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .chat-header input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .chat-box {
      height: 260px;
      overflow-y: auto;
      padding: 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
    }

    .chat-message {
      margin-bottom: 8px;
      line-height: 1.4;
      word-break: break-word;
    }

    .chat-message .user {
      color: #00bfff;
      font-weight: bold;
      margin-right: 6px;
    }

    .chat-actions {
      display: flex;
      gap: 8px;
    }

    .chat-actions input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .chat-actions button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #00bfff, #7ad7ff);
      color: #04101d;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .chat-actions button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(0, 191, 255, 0.3);
    }

    .chat-actions button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>

  <!-- Mux Player library -->
  <script src="https://unpkg.com/@mux/mux-player"></script>
</head>
<body>
  <!-- STAR LAYERS -->
  <div class="star-layer" id="layer1"></div>
  <div class="star-layer" id="layer2"></div>
  <div class="star-layer" id="layer3"></div>

  <!-- MAIN CONTENT -->
  <div id="content">
    <!-- Replace this URL with your GitHub-hosted logo image -->
    <img src="channel9.png" alt="9 Logo" />

    <!-- ✅ MUX Livestream Player -->
    <div class="mux-player-container">
      <mux-player
        stream-type="live"
        playback-id="Fl7MXxmxZz9NrkyXUUZAMnNSTS023JXzQfccTqnZ824Q"
        primary-color="#00bfff"
        metadata-video-title="Live Stream"
        metadata-viewer-user-id="viewer-001"
        autoplay
        muted
      ></mux-player>
    </div>

    <!-- Chat -->
    <div class="chat-container">
      <div class="chat-header">
        <h2>Live Chat</h2>
        <input id="username" type="text" placeholder="Choose a username (optional)" />
      </div>
      <div id="chat-box" class="chat-box" aria-live="polite"></div>
      <div class="chat-actions">
        <input id="msg" type="text" placeholder="Type your message" autocomplete="off" />
        <button id="send" type="button">Send</button>
      </div>
    </div>
  </div>

  <!-- Stars Script -->
  <script>
    const layers = [
      { id: 'layer1', count: 40, size: 1, speed: 0.3 },
      { id: 'layer2', count: 30, size: 2, speed: 0.2 },
      { id: 'layer3', count: 20, size: 3, speed: 0.1 }
    ];

    layers.forEach(layer => {
      const container = document.getElementById(layer.id);
      for (let i = 0; i < layer.count; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        star.style.width = `${layer.size}px`;
        star.style.height = `${layer.size}px`;

        const x = Math.random() * 100;
        const y = Math.random() * 100;
        star.style.left = `${x}vw`;
        star.style.top = `${y}vh`;

        const duration = (Math.random() * 10 + 10) / layer.speed;
        const delay = Math.random() * 20;

        star.style.animation = `fall ${duration}s linear ${delay}s infinite`;

        container.appendChild(star);
      }
    });

    const style = document.createElement('style');
    style.innerHTML = `
      @keyframes fall {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(100vh); opacity: 0.3; }
      }
    `;
    document.head.appendChild(style);
  </script>

  <!-- Supabase + chat wiring -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="chat.js" defer></script>
</body>
</html>
