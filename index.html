<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Channel N9NE Live</title>

<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5674785666719328" crossorigin="anonymous"></script>

<!-- 3D MODEL VIEWER -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<!-- Styles -->
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}
body { min-height: 100vh; position: relative; }

/* ✨ Stars */
.star-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
.star { position: absolute; background: white; border-radius: 50%; opacity: 0.8; box-shadow: 0 0 6px 2px rgba(255,255,255,0.8); }

/* Layout */
#content { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; padding: 5vh 0 100px 0; min-height: 100vh; width: 100%; box-sizing: border-box; }
#content img { width: 80%; max-width: 600px; height: auto; margin-bottom: 30px; }

/* STREAM + CHAT */
.stream-wrapper { display: flex; flex-direction: row; justify-content: center; align-items: flex-start; gap: 20px; width: 95%; max-width: 1200px; box-sizing: border-box; }
.stream-column { flex: 3; display: flex; flex-direction: column; align-items: flex-end; width: 100%; box-sizing: border-box; }
.mux-player-container { width: 100%; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: rgba(0, 0, 0, 0.3); }
mux-player { width: 100%; height: 100%; }

/* BUTTONS + 3D MODEL */
.button-row {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 12px;
  padding-right: 8px;
  box-sizing: border-box;
  position: relative;
}

.n9ne-btn img {
  width: 28px;
  height: 28px;
  object-fit: contain;
  transition: all 0.25s ease;
  filter: drop-shadow(0 0 1px rgba(0,191,255,0.8));
  opacity: 0.9;
}

.n9ne-btn img:hover {
  transform: scale(1.12);
  filter: drop-shadow(0 0 4px rgba(0,255,255,1));
  opacity: 1;
}

@keyframes pulseGlow {
  0%,100% { filter: drop-shadow(0 0 1px rgba(0,255,255,.5)); }
  50% { filter: drop-shadow(0 0 4px rgba(0,255,255,1)); }
}
.n9ne-btn img.live {
  animation: pulseGlow 2.5s infinite;
}

/* 🧊 3D MODEL — no glow, larger size */
.n9ne-model {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 140px; /* Larger model container */
  height: 140px;
  border-radius: 10px;
  background: transparent;
  transition: transform 0.3s ease;
}

.n9ne-model:hover {
  transform: scale(1.05);
}

model-viewer {
  width: 100%;
  height: 100%;
  cursor: pointer;
  border-radius: 10px;
  background: transparent;
  box-shadow: none;
  filter: none;
}

/* 📱 MOBILE ADJUSTMENT */
@media (max-width: 900px) {
  .button-row {
    justify-content: center;
    padding-right: 0;
    margin-top: 10px;
  }
  .n9ne-btn img {
    width: 24px;
    height: 24px;
  }
  .n9ne-model {
    width: 100px;
    height: 100px;
  }
}

/* CHAT */
#chat { flex: 1.2; display: flex; flex-direction: column; border: 1px solid #333; border-radius: 10px; background: rgba(0,0,0,0.3); padding: 10px; max-height: 80vh; width: 100%; box-sizing: border-box; }
#chat-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 5px; color: #00bfff; }
#chat-box { flex: 1; overflow-y: auto; padding: 10px; border-bottom: 1px solid #333; }
.msg { margin-bottom: 6px; line-height: 1.4; }
.user { color: #00ffff; font-weight: bold; }
.time { color: #777; font-size: 0.8em; margin-left: 5px; }
#chat-inputs { display: flex; gap: 8px; margin-top: 8px; }
input, button { border: none; border-radius: 5px; padding: 8px; }
input { flex: 1; background: #111; color: #fff; }
button { background: #00bfff; color: #000; font-weight: bold; cursor: pointer; }
button:hover { background: #00ffff; }

/* 🎥 Carousel */
#archive-section {
  margin-top: 40px;
  width: 95%;
  max-width: 1200px;
  text-align: center;
  color: #00bfff;
  margin-left: auto;
  margin-right: auto;
}
#archive-carousel {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  padding: 10px 30px 20px 30px;
  scroll-snap-type: x mandatory;
  scroll-padding: 30px;
  justify-content: flex-start;
  box-sizing: border-box;
  scroll-behavior: smooth;
}
#archive-carousel::-webkit-scrollbar { display: none; }
.archive-card {
  flex: 0 0 auto;
  width: 260px;
  background: rgba(0,0,0,0.4);
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 0 6px rgba(0,255,255,0.3);
  scroll-snap-align: center;
  text-align: left;
}
.archive-card:last-child { margin-right: 30px; }
.archive-card img { width: 100%; border-radius: 8px; cursor: pointer; }
.archive-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.like-btn { cursor: pointer; color: #00ffff; font-size: 0.9em; transition: 0.15s; }
.like-btn:hover { color: #fff; transform: scale(1.1); }
.duration-tag { font-size: 0.85em; color: #00bfff; }

@media (max-width: 900px) {
  .stream-wrapper { flex-direction: column; align-items: center; width: 100%; }
  #chat { width: 95%; max-height: 400px; }
}
</style>

<script src="https://unpkg.com/@mux/mux-player"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<!-- 🌠 Stars -->
<div class="star-layer" id="layer1"></div>
<div class="star-layer" id="layer2"></div>
<div class="star-layer" id="layer3"></div>

<div id="content">
  <img src="channel9.png" alt="Channel N9NE Logo"/>

  <div class="stream-wrapper">
    <div class="stream-column">
      <div class="mux-player-container">
        <mux-player
          stream-type="live"
          playback-id="Fl7MXxmxZz9NrkyXUUZAMnNSTS023JXzQfccTqnZ824Q"
          primary-color="#00bfff"
          metadata-video-title="Live Stream"
          autoplay muted>
        </mux-player>
      </div>

      <!-- 🚀 Buttons directly under video -->
      <div class="button-row">
        <a href="https://www.venmo.com/u/channeln9ne" target="_blank" class="n9ne-btn">
          <img src="venmo.png" alt="Venmo" class="live" />
        </a>
        <a href="https://buy.stripe.com/8x2aEYbfL7nqeesdAFefC01" target="_blank" class="n9ne-btn">
          <img src="sub.png" alt="Subscribe" class="live" />
        </a>
        <!-- 🧊 3D Model CTA -->
        <a href="https://yourdestinationlink.com" target="_blank" class="n9ne-model">
          <model-viewer
            src="tob2.glb"
            alt="N9ne 3D"
            auto-rotate
            camera-controls
            disable-zoom
            ar>
          </model-viewer>
        </a>
      </div>
    </div>

    <!-- 💬 Chat -->
    <div id="chat">
      <div id="chat-header"><span>💬 Chat is Live</span><span id="viewer-count">0 watching</span></div>
      <div id="chat-box"></div>
      <div id="chat-inputs">
        <input id="username" placeholder="Name"/>
        <input id="msg" placeholder="Say something..."/>
        <button id="send">Send</button>
      </div>
    </div>
  </div>

  <!-- 🎥 Previous Streams Carousel BELOW CHAT -->
  <hr style="width:80%; border: 1px solid rgba(0,255,255,0.2); margin: 40px auto;">
  <div id="archive-section">
    <h2>Previous Streams</h2>
    <div id="archive-carousel"></div>
  </div>
</div>

<!-- ✨ Stars Script -->
<script>
const layers=[{id:'layer1',count:40,size:1,speed:.3},{id:'layer2',count:30,size:2,speed:.2},{id:'layer3',count:20,size:3,speed:.1}];
layers.forEach(l=>{const c=document.getElementById(l.id);for(let i=0;i<l.count;i++){const s=document.createElement('div');s.classList.add('star');s.style.width=`${l.size}px`;s.style.height=`${l.size}px`;s.style.left=`${Math.random()*100}vw`;s.style.top=`${Math.random()*100}vh`;const d=(Math.random()*10+10)/l.speed;const delay=Math.random()*20;s.style.animation=`fall ${d}s linear ${delay}s infinite`;c.appendChild(s);}});
const style=document.createElement('style');style.innerHTML=`@keyframes fall{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(100vh);opacity:.3;}}`;document.head.appendChild(style);
</script>
</body>
</html>
