<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Starry Background</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }

    .star-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    #content {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #content img {
      width: 750px;         /* 3× the original 250px */
      max-width: 90vw;      /* Responsive fallback */
      height: auto;
    }
  </style>
</head>

  <div class="star-layer" id="layer1"></div>
  <div class="star-layer" id="layer2"></div>
  <div class="star-layer" id="layer3"></div>

  <div id="content">
    <img src="channel9.png" alt="9 Logo" />
  </div>
