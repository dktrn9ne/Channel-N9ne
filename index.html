<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Starry Background</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }

    .star-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    #content {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #content img {
      max-width: 250px;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="star-layer" id="layer1"></div>
  <div class="star-layer" id="layer2"></div>
  <div class="star-layer" id="layer3"></div>

  <div id="content">
    <img src="https://github.com/dktrn9ne/Channel-N9ne/blob/main/channel9.png" alt="9 Logo" />
  </div>

  <script>
    const layers = [
      { id: 'layer1', count: 40, size: 1, speed: 0.3 },
      { id: 'layer2', count: 30, size: 2, speed: 0.2 },
      { id: 'layer3', count: 20, size: 3, speed: 0.1 }
    ];

    layers.forEach(layer => {
      const container = document.getElementById(layer.id);
      for (let i = 0; i < layer.count; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        star.style.width = `${layer.size}px`;
        star.style.height = `${layer.size}px`;

        // Random position
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        star.style.left = `${x}vw`;
        star.style.top = `${y}vh`;

        // Random animation speed/duration and delay
        const duration = (Math.random() * 10 + 10) / layer.speed;
        const delay = Math.random() * 20;

        star.style.animation = `fall ${duration}s linear ${delay}s infinite`;

        container.appendChild(star);
      }
    });

    const style = document.createElement('style');
    style.innerHTML = `
      @keyframes fall {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(100vh); opacity: 0.3; }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
