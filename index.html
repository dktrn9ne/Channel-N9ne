<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Channel N9NE Live</title>

<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5674785666719328" crossorigin="anonymous"></script>

<!-- 3D MODEL VIEWER -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<!-- Styles -->
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}
body { min-height: 100vh; position: relative; }

/* ✨ Stars */
.star-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
.star { position: absolute; background: white; border-radius: 50%; opacity: 0.8; box-shadow: 0 0 6px 2px rgba(255,255,255,0.8); }

/* Layout */
#content { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; padding: 5vh 0 100px 0; min-height: 100vh; width: 100%; box-sizing: border-box; }
#content img { width: 80%; max-width: 600px; height: auto; margin-bottom: 30px; }

/* STREAM + CHAT */
.stream-wrapper { display: flex; flex-direction: row; justify-content: center; align-items: flex-start; gap: 20px; width: 95%; max-width: 1200px; box-sizing: border-box; }
.stream-column { flex: 3; display: flex; flex-direction: column; align-items: flex-end; width: 100%; box-sizing: border-box; }
.mux-player-container { width: 100%; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: rgba(0, 0, 0, 0.3); }
mux-player { width: 100%; height: 100%; }

/* BUTTONS + 3D MODEL */
.button-row {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 12px;
  padding-right: 8px;
  box-sizing: border-box;
  position: relative;
}

.n9ne-btn img {
  width: 28px;
  height: 28px;
  object-fit: contain;
  transition: all 0.25s ease;
  filter: drop-shadow(0 0 1px rgba(0,191,255,0.8));
  opacity: 0.9;
}

.n9ne-btn img:hover {
  transform: scale(1.12);
  filter: drop-shadow(0 0 4px rgba(0,255,255,1));
  opacity: 1;
}

@keyframes pulseGlow {
  0%,100% { filter: drop-shadow(0 0 1px rgba(0,255,255,.5)); }
  50% { filter: drop-shadow(0 0 4px rgba(0,255,255,1)); }
}
.n9ne-btn img.live {
  animation: pulseGlow 2.5s infinite;
}

/* 🧊 3D MODEL — 3× larger */
.n9ne-model {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 132px; /* 3× larger */
  height: 132px;
  border-radius: 12px;
  background: transparent;
  transition: transform 0.3s ease;
  transform-origin: center bottom; /* keeps it visually aligned */
  margin-top: -40px; /* tucks it closer to the buttons */
}

.n9ne-model:hover {
  transform: scale(1.05);
}

model-viewer {
  width: 100%;
  height: 100%;
  cursor: pointer;
  border-radius: 12px;
  background: transparent;
  box-shadow: none;
  filter: none;
}


/* 📱 MOBILE ADJUSTMENT */
@media (max-width: 900px) {
  .button-row {
    justify-content: center;
    padding-right: 0;
    margin-top: 10px;
  }
  .n9ne-btn img {
    width: 24px;
    height: 24px;
  }
  .n9ne-model {
    width: 100px;
    height: 100px;
  }
}

/* CHAT */
#chat { flex: 1.2; display: flex; flex-direction: column; border: 1px solid #333; border-radius: 10px; background: rgba(0,0,0,0.3); padding: 10px; max-height: 80vh; width: 100%; box-sizing: border-box; }
#chat-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 5px; color: #00bfff; }
#chat-box { flex: 1; overflow-y: auto; padding: 10px; border-bottom: 1px solid #333; }
.msg { margin-bottom: 6px; line-height: 1.4; }
.user { color: #00ffff; font-weight: bold; }
.time { color: #777; font-size: 0.8em; margin-left: 5px; }
#chat-inputs { display: flex; gap: 8px; margin-top: 8px; }
input, button { border: none; border-radius: 5px; padding: 8px; }
input { flex: 1; background: #111; color: #fff; }
button { background: #00bfff; color: #000; font-weight: bold; cursor: pointer; }
button:hover { background: #00ffff; }

/* 🎥 Carousel */
#archive-section {
  margin-top: 40px;
  width: 95%;
  max-width: 1200px;
  text-align: center;
  color: #00bfff;
  margin-left: auto;
  margin-right: auto;
}
#archive-carousel {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  padding: 10px 30px 20px 30px;
  scroll-snap-type: x mandatory;
  scroll-padding: 30px;
  justify-content: flex-start;
  box-sizing: border-box;
  scroll-behavior: smooth;
}
#archive-carousel::-webkit-scrollbar { display: none; }
.archive-card {
  flex: 0 0 auto;
  width: 260px;
  background: rgba(0,0,0,0.4);
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 0 6px rgba(0,255,255,0.3);
  scroll-snap-align: center;
  text-align: left;
}
.archive-card:last-child { margin-right: 30px; }
.archive-card img { width: 100%; border-radius: 8px; cursor: pointer; }
.archive-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.like-btn { cursor: pointer; color: #00ffff; font-size: 0.9em; transition: 0.15s; }
.like-btn:hover { color: #fff; transform: scale(1.1); }
.duration-tag { font-size: 0.85em; color: #00bfff; }

@media (max-width: 900px) {
  .stream-wrapper { flex-direction: column; align-items: center; width: 100%; }
  #chat { width: 95%; max-height: 400px; }
}
</style>

<script src="https://unpkg.com/@mux/mux-player"></script>
</head>

<body>
<!-- 🌠 Stars -->
<div class="star-layer" id="layer1"></div>
<div class="star-layer" id="layer2"></div>
<div class="star-layer" id="layer3"></div>

<div id="content">
  <img src="channel9.png" alt="Channel N9NE Logo"/>

  <div class="stream-wrapper">
    <div class="stream-column">
      <div class="mux-player-container">
        <mux-player
          stream-type="live"
          playback-id="Fl7MXxmxZz9NrkyXUUZAMnNSTS023JXzQfccTqnZ824Q"
          primary-color="#00bfff"
          metadata-video-title="Live Stream"
          autoplay muted>
        </mux-player>
      </div>

      <!-- 🚀 Buttons directly under video -->
      <div class="button-row">
        <a href="https://www.venmo.com/u/channeln9ne" target="_blank" class="n9ne-btn">
          <img src="venmo.png" alt="Venmo" class="live" />
        </a>
        <a href="https://buy.stripe.com/8x2aEYbfL7nqeesdAFefC01" target="_blank" class="n9ne-btn">
          <img src="sub.png" alt="Subscribe" class="live" />
        </a>
        <!-- 🧊 3D Model CTA -->
        <a href="https://yourdestinationlink.com" target="_blank" class="n9ne-model">
          <model-viewer
            src="tob.glb"
            alt="N9ne 3D"
            auto-rotate
            rotation-per-second="15deg"
            camera-controls
            disable-zoom
            exposure="1.2"
            shadow-intensity="1"
            shadow-softness="1"
            environment-image="neutral"
            tone-mapping="aces"
            interpolation-decay="200"
            camera-orbit="0deg 75deg auto"
            field-of-view="20deg"
            style="width:44px;height:44px;border-radius:8px;background:transparent;">
          </model-viewer>
        </a>
      </div>
    </div>

    <!-- 💬 Chat -->
    <div id="chat">
      <div id="chat-header"><span>💬 Chat is Live</span><span id="viewer-count">0 watching</span></div>
      <div id="chat-box"></div>
      <div id="chat-inputs">
        <input id="username" placeholder="Name"/>
        <input id="msg" placeholder="Say something..."/>
        <button id="send">Send</button>
      </div>
    </div>
  </div>

  <!-- 🎥 Previous Streams Carousel BELOW CHAT -->
  <hr style="width:80%; border: 1px solid rgba(0,255,255,0.2); margin: 40px auto;">
  <div id="archive-section">
    <h2>Previous Streams</h2>
    <div id="archive-carousel"></div>
  </div>
</div>

<!-- ✨ Stars Script -->
<script>
const layers = [
  { id: 'layer1', count: 120, sizeRange: [1, 2], speed: 0.3 },
  { id: 'layer2', count: 90,  sizeRange: [2, 3], speed: 0.2 },
  { id: 'layer3', count: 60,  sizeRange: [3, 4], speed: 0.1 }
];
layers.forEach(l => {
  const c = document.getElementById(l.id);
  for (let i = 0; i < l.count; i++) {
    const s = document.createElement('div');
    s.classList.add('star');
    const size = Math.random() * (l.sizeRange[1] - l.sizeRange[0]) + l.sizeRange[0];
    s.style.width = `${size}px`;
    s.style.height = `${size}px`;
    s.style.left = `${Math.random() * 100}vw`;
    s.style.top = `${Math.random() * 100}vh`;
    s.style.opacity = Math.random() * 0.8 + 0.2;
    s.style.animation = `twinkle ${4 + Math.random() * 4}s ease-in-out ${Math.random() * 3}s infinite, fall ${(Math.random() * 10 + 15) / l.speed}s linear ${Math.random() * 20}s infinite`;
    c.appendChild(s);
  }
});
const style = document.createElement('style');
style.innerHTML = `
@keyframes fall {0%{transform:translateY(0);opacity:1;}100%{transform:translateY(100vh);opacity:0.3;}}
@keyframes twinkle {0%,100%{opacity:0.8;transform:scale(1);}50%{opacity:0.3;transform:scale(1.3);}}`;
document.head.appendChild(style);
</script>

<!-- 🎞 Previous Streams Carousel Script -->
<script>
async function loadArchives() {
  const container = document.getElementById('archive-carousel');
  container.innerHTML = '<p style="color:#00bfff;">Loading streams...</p>';
  try {
    const muxRes = await fetch('https://channeln9ne.xyz/api/get-mux-streams');
    const muxStreams = await muxRes.json();
    container.innerHTML = '';
    muxStreams.forEach(stream => {
      const card = document.createElement('div');
      card.classList.add('archive-card');
      card.innerHTML = `
        <img src="${stream.thumbnail_url}" alt="${stream.title}" onclick="openMuxPlayer('${stream.playback_id}','${stream.title}')">
        <div class="archive-meta">
          <span>${stream.views || 0} 👁️</span>
          <span class="duration-tag">⏱️ ${stream.duration || '--'}</span>
        </div>
        <div class="archive-title">${stream.title}</div>`;
      container.appendChild(card);
    });
  } catch (err) {
    console.error(err);
    container.innerHTML = '<p style="color:red;">Error loading streams.</p>';
  }
}

function openMuxPlayer(playbackId, title) {
  const modal = document.createElement('div');
  modal.id = 'mux-modal';
  modal.innerHTML = `
    <div id="modal-bg" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:999;">
      <div style="width:80%;max-width:800px;">
        <mux-player stream-type="on-demand" playback-id="${playbackId}" primary-color="#00bfff" metadata-video-title="${title}" autoplay></mux-player>
        <button onclick="closeMuxModal()" style="margin-top:10px;background:#00bfff;border:none;padding:8px 16px;border-radius:5px;font-weight:bold;cursor:pointer;">Close</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

function closeMuxModal() {
  const modal = document.getElementById('mux-modal');
  if (modal) modal.remove();
}
loadArchives();
</script>
</body>
</html>
