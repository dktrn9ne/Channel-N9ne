<!-- 💬 Supabase Chat Integration -->
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient(
  'https://kidmxnxkhyhaehzexatm.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpZG14bnhraHloYWVoemV4YXRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5MTI3NjYsImV4cCI6MjA3NzQ4ODc2Nn0.JyyK2yYLP3WX4QIxnJcH_f4KNuDlaJ-e0ZKb07uJS_U'
);

const chatBox = document.getElementById('chat-box');
const usernameInput = document.getElementById('username');
const msgInput = document.getElementById('msg');
const sendBtn = document.getElementById('send');

async function loadMessages() {
  const { data, error } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
  if (error) return console.error(error);
  renderMessages(data);
}

function renderMessages(messages) {
  chatBox.innerHTML = '';
  messages.forEach(m => {
    const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const el = document.createElement('div');
    el.classList.add('msg');
    el.innerHTML = `<span class="user">${m.username}</span>: ${m.message || m.content} <span class="time">${time}</span>`;
    chatBox.appendChild(el);
  });
  chatBox.scrollTop = chatBox.scrollHeight;
}

sendBtn.onclick = async () => {
  const username = usernameInput.value.trim() || 'Anon';
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = '';
  await supabase.from('messages').insert([{ username, message: text }]);
};

supabase.channel('realtime:messages')
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
    const m = payload.new;
    const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const el = document.createElement('div');
    el.classList.add('msg');
    el.innerHTML = `<span class="user">${m.username}</span>: ${m.message || m.content} <span class="time">${time}</span>`;
    chatBox.appendChild(el);
    chatBox.scrollTop = chatBox.scrollHeight;
  })
  .subscribe();

loadMessages();
</script>

<!-- 🎥 Previous Streams Fetch + Display -->
<script>
async function loadArchives() {
  try {
    const res = await fetch('https://channeln9ne.xyz/api/get-mux-streams'); // ✅ Make sure your API route is deployed
    if (!res.ok) throw new Error('Failed to load streams');
    const streams = await res.json();

    const container = document.getElementById('archive-carousel');
    container.innerHTML = '';

    streams.forEach(stream => {
      const card = document.createElement('div');
      card.classList.add('archive-card');
      card.innerHTML = `
        <img src="${stream.thumbnail_url}" alt="${stream.title}" onclick="window.open('https://stream.mux.com/${stream.playback_id}.m3u8','_blank')" />
        <div class="archive-meta">
          <span>${stream.title}</span>
        </div>
        <div class="archive-meta">
          <span>${Math.round(stream.duration / 60)} min</span>
          <span>👁️ ${stream.views}</span>
        </div>
      `;
      container.appendChild(card);
    });
  } catch (err) {
    console.error('Error loading streams:', err);
  }
}

loadArchives();
</script>
