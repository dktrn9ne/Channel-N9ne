<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Channel N9NE Live</title>
<style>
html,body{
  margin:0;padding:0;height:100%;
  background:radial-gradient(ellipse at bottom,#1B2735 0%,#090A0F 100%);
  color:#fff;font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}
body{min-height:150vh;position:relative;}

/* ✨ Star layers */
.star-layer{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:0;overflow:hidden;
}
.star{
  position:absolute;background:white;border-radius:50%;
  opacity:0.9;box-shadow:0 0 6px 2px rgba(255,255,255,0.8);
}

/* Content layout */
#content{
  position:relative;z-index:10;display:flex;flex-direction:column;
  align-items:center;padding-top:5vh;padding-bottom:200px;min-height:100vh;
}
#content img{width:750px;max-width:90vw;margin-bottom:40px;}

.stream-wrapper{
  display:flex;flex-direction:row;justify-content:center;gap:20px;
  width:90%;max-width:1400px;
}
.stream-column{
  flex:3;display:flex;flex-direction:column;align-items:flex-end;
}
.mux-player-container{
  width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  background:rgba(0,0,0,0.3);
}
mux-player{width:100%;height:100%;}

/* 🎯 Small button row under stream */
.button-row{
  display:flex;
  flex-direction:row;
  justify-content:flex-end;
  gap:6px;
  margin-top:10px;
  margin-right:8px;
  perspective:800px;
}
.n9ne-btn img{
  width:22px; /* smaller buttons */
  transform:rotateX(15deg);
  transition:all .3s ease;
  filter:drop-shadow(0 0 2px rgba(0,191,255,.5));
}
.n9ne-btn img:hover{
  transform:rotateX(0deg) rotateY(10deg) translateZ(6px) scale(1.2);
  filter:drop-shadow(0 0 8px rgba(0,255,255,.9));
}
@keyframes pulseGlow{
  0%,100%{filter:drop-shadow(0 0 2px rgba(0,255,255,.6));}
  50%{filter:drop-shadow(0 0 8px rgba(0,255,255,1));}
}
.n9ne-btn img.live{animation:pulseGlow 2s infinite;}

/* Chat */
#chat{
  flex:1.2;display:flex;flex-direction:column;
  border:1px solid #333;border-radius:10px;
  background:rgba(0,0,0,0.3);padding:10px;max-height:80vh;
}
#chat-header{
  display:flex;justify-content:space-between;align-items:center;
  font-weight:bold;border-bottom:1px solid #333;
  padding-bottom:5px;margin-bottom:5px;color:#00bfff;
}
#chat-box{
  flex:1;overflow-y:auto;padding:10px;border-bottom:1px solid #333;
}
.msg{margin-bottom:6px;line-height:1.4;}
.user{color:#00ffff;font-weight:bold;}
.time{color:#777;font-size:.8em;margin-left:5px;}
#chat-inputs{display:flex;gap:8px;margin-top:8px;
