<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starry Parallax Background</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      overflow: hidden;
      font-family: 'Lato', sans-serif;
    }

    #stars, #stars2, #stars3 {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #stars::after, #stars2::after, #stars3::after {
      content: " ";
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      background: transparent;
      box-shadow: 
        1000px 200px white,
        150px 300px white,
        400px 600px white,
        800px 900px white,
        1200px 1100px white,
        600px 700px white,
        1300px 500px white,
        900px 400px white,
        100px 1300px white,
        200px 1500px white;
    }

    #stars {
      animation: animStar 50s linear infinite;
    }

    #stars2::after {
      width: 2px;
      height: 2px;
    }

    #stars2 {
      animation: animStar 100s linear infinite;
    }

    #stars3::after {
      width: 3px;
      height: 3px;
    }

    #stars3 {
      animation: animStar 150s linear infinite;
    }

    @keyframes animStar {
      from { transform: translateY(0); }
      to { transform: translateY(-2000px); }
    }

    #content {
      position: relative;
      z-index: 10;
      color: white;
      text-align: center;
      padding-top: 20vh;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 0.5em;
    }

    p {
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div id="stars"></div>
  <div id="stars2"></div>
  <div id="stars3"></div>

  <div id="content">
    <h1>Welcome to the Galaxy</h1>
    <p>This is a starry background made with pure CSS</p>
  </div>
</body>
</html>
