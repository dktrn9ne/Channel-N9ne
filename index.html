<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Starry Background with Logo + Livestream</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      overflow-x: hidden;
      font-family: 'Arial', sans-serif;
    }

    .star-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    #content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 5vh;
      min-height: 100vh;
    }

    #content img {
      width: 750px;
      max-width: 90vw;
      height: auto;
      margin-bottom: 40px;
    }

    .mux-player-container {
      width: 80%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      position: relative;
      z-index: 10;
    }

    mux-player {
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- Mux Player library (Web Component) -->
  <script src="https://unpkg.com/@mux/mux-player"></script>
</head>
<body>
  <!-- STAR LAYERS -->
  <div class="star-layer" id="layer1"></div>
  <div class="star-layer" id="layer2"></div>
  <div class="star-layer" id="layer3"></div>

  <!-- MAIN CONTENT -->
  <div id="content">
    <img src="channel9.png" alt="9 Logo" />

    <!-- MUX Livestream Player -->
    <div class="mux-player-container">
      <mux-player
        stream-type="live"
        playback-id="p67oTFXv85eG01O4YRUt9dxehDQ02LVNlHLt00tVR4cDvE"
        primary-color="#00bfff"
        metadata-video-title="Live Stream"
        metadata-viewer-user-id="user-123"
        autoplay
        muted
      ></mux-player>
    </div>
  </div>

  <!-- Stars Script -->
  <script>
    const layers = [
      { id: 'layer1', count: 40, size: 1, speed: 0.3 },
      { id: 'layer2', count: 30, size: 2, speed: 0.2 },
      { id: 'layer3', count: 20, size: 3, speed: 0.1 }
    ];

    layers.forEach(layer => {
      const container = document.getElementById(layer.id);
      for (let i = 0; i < layer.count; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        star.style.width = `${layer.size}px`;
        star.style.height = `${layer.size}px`;

        const x = Math.random() * 100;
        const y = Math.random() * 100;
        star.style.left = `${x}vw`;
        star.style.top = `${y}vh`;

        const duration = (Math.random() * 10 + 10) / layer.speed;
        const delay = Math.random() * 20;

        star.style.animation = `fall ${duration}s linear ${delay}s infinite`;

        container.appendChild(star);
      }
    });

    const style = document.createElement('style');
    style.innerHTML = `
      @keyframes fall {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(100vh); opacity: 0.3; }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
