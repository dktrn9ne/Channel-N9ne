<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Channel N9NE Live</title>
<style>
html,body{
  margin:0;padding:0;height:100%;
  background:radial-gradient(ellipse at bottom,#1B2735 0%,#090A0F 100%);
  color:#fff;font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}
body{min-height:150vh;position:relative;}

/* ✨ Star layers — now visible */
.star-layer{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}
.star{
  position:absolute;
  background:white;
  border-radius:50%;
  opacity:0.9;
  box-shadow:0 0 6px 2px rgba(255,255,255,0.8);
}

#content{
  position:relative;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:5vh;
  padding-bottom:200px;
  min-height:100vh;
}

#content img{
  width:750px;
  max-width:90vw;
  margin-bottom:40px;
}

/* Layout */
.stream-wrapper{
  display:flex;
  flex-direction:row;
  justify-content:center;
  gap:20px;
  width:90%;
  max-width:1400px;
}

.stream-column{
  flex:3;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}

.mux-player-container{
  width:100%;
  aspect-ratio:16/9;
  border-radius:10px;
  overflow:hidden;
  background:rgba(0,0,0,0.3); /* transparent for stars */
}
mux-player{
  width:100%;
  height:100%;
}

/* 🎯 Subscribe button */
#n9ne-button{
  margin-top:8px;
  margin-right:8px;
  perspective:800px;
  text-align:right;
}
#n9ne-button img{
  width:70px;
  transform:rotateX(15deg);
  transition:all .3s ease;
  filter:drop-shadow(0 0 4px rgba(0,191,255,.5));
}
#n9ne-button:hover img{
  transform:rotateX(0deg) rotateY(10deg) translateZ(10px) scale(1.1);
  filter:drop-shadow(0 0 12px rgba(0,255,255,.9));
}
@keyframes pulseGlow{
  0%,100%{filter:drop-shadow(0 0 4px rgba(0,255,255,.6));}
  50%{filter:drop-shadow(0 0 12px rgba(0,255,255,1));}
}
#n9ne-button img.live{animation:pulseGlow 2s infinite;}

/* Chat */
#chat{
  flex:1.2;
  display:flex;
  flex-direction:column;
  border:1px solid #333;
  border-radius:10px;
  background:rgba(0,0,0,0.3); /* more transparent for stars */
  padding:10px;
  max-height:80vh;
}
#chat-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
  border-bottom:1px solid #333;
  padding-bottom:5px;
  margin-bottom:5px;
  color:#00bfff;
}
#chat-box{
  flex:1;
  overflow-y:auto;
  padding:10px;
  border-bottom:1px solid #333;
}
.msg{margin-bottom:6px;line-height:1.4;}
.user{color:#00ffff;font-weight:bold;}
.time{color:#777;font-size:.8em;margin-left:5px;}
#chat-inputs{display:flex;gap:8px;margin-top:8px;}
input,button{border:none;border-radius:5px;padding:8px;}
input{flex:1;background:#111;color:#fff;}
button{background:#00bfff;color:#000;font-weight:bold;cursor:pointer;}
button:hover{background:#00ffff;}
@media(max-width:900px){
  .stream-wrapper{flex-direction:column;align-items:center;}
  #chat{width:100%;max-height:400px;}
  .stream-column{align-items:center;}
  #n9ne-button{text-align:center;margin-right:0;}
}
</style>

<script src="https://unpkg.com/@mux/mux-player"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<!-- ✨ Falling stars -->
<script>
const layers=[
 {id:'layer1',count:40,size:1,speed:.3},
 {id:'layer2',count:30,size:2,speed:.2},
 {id:'layer3',count:20,size:3,speed:.1}
];
layers.forEach(l=>{
 const c=document.getElementById(l.id);
 for(let i=0;i<l.count;i++){
   const s=document.createElement('div');
   s.classList.add('star');
   s.style.width=`${l.size}px`;
   s.style.height=`${l.size}px`;
   s.style.left=`${Math.random()*100}vw`;
   s.style.top=`${Math.random()*100}vh`;
   const d=(Math.random()*10+10)/l.speed;
   const delay=Math.random()*20;
   s.style.animation=`fall ${d}s linear ${delay}s infinite`;
   c.appendChild(s);
 }
});
const style=document.createElement('style');
style.innerHTML=`@keyframes fall{
 0%{transform:translateY(0);opacity:1;}
 100%{transform:translateY(100vh);opacity:0.3;}
}`;
document.head.appendChild(style);
</script>

function formatTime(iso){
  const d=new Date(iso);
  return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
function addMessage(m){
  const div=document.createElement('div');
  div.classList.add('msg');

async function loadMessages(){
  const {data,error}=await db.from('messages').select('*').order('created_at',{ascending:true});
