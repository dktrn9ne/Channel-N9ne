<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Channel N9NE Live</title>

<style>
:root {
  --content-gutter: clamp(14px, 4vw, 30px);
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}
body { min-height: 100vh; position: relative; }

/* ✨ Stars */
.star-layer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
  transform-style: preserve-3d;
  --offset-x: 0px;
  --offset-y: 0px;
  --pulse-translate: 0px;
  --pulse-scale: 1;
  transform: translate3d(calc(var(--offset-x)), calc(var(--offset-y) + var(--pulse-translate)), 0) scale(var(--pulse-scale));
  animation: layerPulse 60s ease-in-out infinite;
}
.star {
  position: absolute;
  background: radial-gradient(circle at 35% 35%, #fff, rgba(255,255,255,0.4) 55%, transparent 70%);
  border-radius: 50%;
  opacity: 0.85;
  filter: drop-shadow(0 0 4px rgba(0, 200, 255, 0.65));
  mix-blend-mode: screen;
  --scale-base: 1;
  --scale-start: 0.9;
  --scale-mid: 1.05;
  --drift-x: 0px;
  --drift-y: 0px;
  --drift-z: 0px;
  --twinkle-duration: 6s;
  --twinkle-delay: 0s;
  --drift-duration: 120s;
  --drift-delay: 0s;
  animation: twinkle var(--twinkle-duration) ease-in-out var(--twinkle-delay) infinite,
             drift var(--drift-duration) linear var(--drift-delay) infinite;
}

/* Layout */
#content {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 5vh var(--content-gutter) 100px var(--content-gutter);
  min-height: 100vh;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  box-sizing: border-box;
}
#content img {
  width: min(80%, 520px);
  height: auto;
  margin-bottom: 30px;
}

/* STREAM + CHAT */
.stream-wrapper {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(360px, 1.35fr);
  align-items: flex-start;
  justify-content: center;
  align-items: flex-start;
  gap: clamp(16px, 3vw, 26px);
  width: 100%;
  box-sizing: border-box;
}
.stream-column {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  width: 100%;
  box-sizing: border-box;
}
.mux-player-container {
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: 10px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.3);
}
mux-player { width: 100%; height: 100%; }

/* BUTTONS */
.button-row {
  display: flex;
  justify-content: center;
  align-items: stretch;
  flex-wrap: wrap;
  gap: clamp(14px, 2.4vw, 28px);
  width: 100%;
  margin-top: 16px;
  padding: 0 clamp(6px, 2vw, 18px);
  box-sizing: border-box;
}
.n9ne-btn {
  flex: 0 1 clamp(80px, 18vw, 160px);
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 600px;
  cursor: pointer;
}
.n9ne-btn img {
  width: 100%;
  height: auto;
  object-fit: contain;
  transform: rotateX(12deg);
  transition: all 0.25s ease;
  filter: drop-shadow(0 0 2px rgba(0,191,255,0.8));
  opacity: 0.95;
}
.n9ne-btn img:hover {
  transform: rotateX(0deg) rotateY(8deg) translateZ(3px) scale(1.15);
  filter: drop-shadow(0 0 8px rgba(0,255,255,1));
  opacity: 1;
}
@keyframes pulseGlow {
  0%,100%{filter:drop-shadow(0 0 2px rgba(0,255,255,.6));}
  50%{filter:drop-shadow(0 0 8px rgba(0,255,255,1));}
}
.n9ne-btn img.live { animation: pulseGlow 2.5s infinite; }

/* CHAT */
#chat {
  flex: 1.5;
  display: flex;
  flex-direction: column;
  border-radius: 16px;
  background: linear-gradient(160deg, rgba(5, 20, 32, 0.85), rgba(0, 5, 10, 0.6));
  padding: 16px;
  max-height: 720px;
  width: 100%;
  box-sizing: border-box;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(0, 191, 255, 0.2);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(0, 191, 255, 0.05);
}
.chat-shell {
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100%;
}
.chat-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(0, 191, 255, 0.2);
}
.chat-title {
  display: flex;
  align-items: center;
  gap: 10px;
}
.chat-title-icon {
  display: inline-flex;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  align-items: center;
  justify-content: center;
  background: rgba(0, 191, 255, 0.18);
  color: #00e5ff;
  font-size: 1.1rem;
}
.chat-title h2 {
  margin: 0;
  font-size: 1.1rem;
  color: #e5f7ff;
  letter-spacing: 0.02em;
}
.chat-subtitle {
  font-weight: normal;
  font-size: 0.9rem;
  color: #7fd9ff;
  margin: 2px 0 0;
}
.chat-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  background: rgba(0, 191, 255, 0.15);
  color: #97e7ff;
  border: 1px solid rgba(0, 191, 255, 0.3);
}
.chat-status-pill[data-state="offline"] {
  background: rgba(255, 88, 88, 0.18);
  color: #ffd0d0;
  border-color: rgba(255, 88, 88, 0.35);
}
#chat-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  height: 100%;
}
#supabase-chat {
  flex: 1;
  min-height: 480px;
  height: 70vh;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(0, 191, 255, 0.15);
  background: rgba(5, 12, 18, 0.72);
  box-shadow: inset 0 0 18px rgba(0, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.chat-message {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 12px;
  border-radius: 14px;
  background: rgba(0, 191, 255, 0.08);
  border: 1px solid rgba(0, 191, 255, 0.2);
  max-width: 85%;
}
.chat-message.is-self {
  margin-left: auto;
  background: rgba(0, 255, 191, 0.12);
  border-color: rgba(0, 255, 191, 0.3);
}
.chat-meta {
  font-size: 0.8rem;
  color: #9ee7ff;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.chat-text {
  margin: 0;
  color: #f5fcff;
  font-size: 0.95rem;
  line-height: 1.3;
}
.chat-composer {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
  border-top: 1px solid rgba(0, 191, 255, 0.2);
  background: rgba(0, 6, 12, 0.65);
}
.chat-identity {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.82rem;
  color: #7fd9ff;
}
.chat-identity-label {
  opacity: 0.7;
}
.chat-identity-name {
  font-weight: 600;
  color: #d2f5ff;
}
.chat-form {
  display: flex;
  gap: 10px;
}
.chat-form input {
  flex: 1;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid rgba(0, 191, 255, 0.4);
  background: rgba(5, 15, 25, 0.85);
  color: #e8f9ff;
}
.chat-form button {
  padding: 10px 16px;
  border-radius: 8px;
  border: 1px solid rgba(0, 191, 255, 0.7);
  background: linear-gradient(135deg, rgba(0, 191, 255, 0.3), rgba(0, 191, 255, 0.12));
  color: #e8f9ff;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  font-weight: 600;
}
.chat-form button:hover {
  transform: translateY(-1px);
  box-shadow: 0 0 10px rgba(0, 255, 255, 0.35);
}
.chat-status,
.chat-hint {
  margin: 0;
  color: #bfefff;
  font-size: 0.95rem;
}
.chat-hint {
  font-size: 0.85rem;
  color: rgba(191, 239, 255, 0.75);
}

/* 🎥 Previous Streams */
#archive-section {
  margin-top: 40px;
  width: 100%;
  color: #00bfff;
  text-align: center;
}
.carousel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.carousel-header h2 {
  margin: 0;
  font-size: clamp(1.2rem, 2vw, 1.6rem);
}
.carousel-controls {
  display: flex;
  gap: 10px;
}
.carousel-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid rgba(0, 191, 255, 0.6);
  background: rgba(0, 0, 0, 0.5);
  color: #00ffff;
  font-size: 1.4rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.carousel-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
}
.carousel-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.carousel-wrapper {
  position: relative;
}
#archive-carousel {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  padding: 10px 4px 10px 4px;
  scroll-snap-type: x mandatory;
  scroll-padding: 16px;
  box-sizing: border-box;
  scroll-behavior: smooth;
}
#archive-carousel:focus-visible {
  outline: 2px solid rgba(0, 255, 255, 0.7);
  outline-offset: 6px;
}
#archive-carousel::-webkit-scrollbar {
  height: 6px;
}
#archive-carousel::-webkit-scrollbar-thumb {
  background: rgba(0, 191, 255, 0.4);
  border-radius: 3px;
}
.carousel-slide {
  flex: 0 0 clamp(260px, 32vw, 360px);
  background: rgba(0, 0, 0, 0.45);
  border-radius: 14px;
  padding: 12px;
  box-shadow: 0 0 10px rgba(0, 255, 255, 0.25);
  scroll-snap-align: center;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.slide-player {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: 10px;
  overflow: hidden;
}
.slide-player iframe {
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 10px;
}
.slide-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.slide-title {
  font-size: 1rem;
  margin: 0;
  color: #e8f9ff;
}
.slide-meta {
  font-size: 0.85rem;
  color: #7fd9ff;
}
.slide-meta span + span::before {
  content: "•";
  margin: 0 6px;
  color: rgba(127, 217, 255, 0.7);
}

/* 📱 MOBILE OPTIMIZATION */
@media (prefers-reduced-motion: reduce) {
  .star-layer, .star { animation: none !important; }
  #archive-carousel { scroll-behavior: auto; }
}

@media (max-width: 900px) {
  #content { padding: 3vh var(--content-gutter) 80px var(--content-gutter); }
  .stream-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    gap: 18px;
  }
  .stream-column {
    align-items: center;
    width: 100%;
  }
  .button-row {
    justify-content: center;
    padding-right: 0;
    margin-top: 10px;
  }
  #archive-section {
    width: 100%;
  }
  .carousel-slide {
    flex-basis: clamp(240px, 80vw, 360px);
  }
  .carousel-btn {
    width: 36px;
    height: 36px;
  }
  #chat {
    width: 100%;
  }
  #supabase-chat {

@media (max-width: 600px) {

  .mux-player-container { border-radius: 8px; }
  .button-row { gap: 12px; width: 100%; }
  .n9ne-btn { flex: 1 1 44%; max-width: none; }
  .carousel-header h2 { flex: 1; font-size: 1.1rem; }
  #chat { padding: 12px; }
  #supabase-chat { min-height: 320px; height: 58vh; }
  #archive-carousel { padding-inline: 0; }
}

<script>
/* MUX ARCHIVES */
async function loadArchives() {
  const defaultEndpoint = "https://fd80be9b-e6fa-45ad-b500-ed4d57b7fa4f/api/get-mux-streams";
  const originEndpoint =
    typeof window !== "undefined" && window.location && window.location.origin
      ? `${window.location.origin}/api/get-mux-streams`
      : defaultEndpoint;
  const candidates = [originEndpoint, defaultEndpoint];
  const container = document.getElementById("archive-carousel");

  try {
    let streams = null;
    let lastError = null;

    for (const endpoint of candidates) {
      try {
        const res = await fetch(endpoint, {
          headers: { Accept: "application/json" },
          mode: "cors",
        });
        if (!res.ok) {
          lastError = new Error(`Request to ${endpoint} failed with status ${res.status}`);
          continue;
        }
        const data = await res.json();
        if (!Array.isArray(data)) {
          lastError = new Error(`Unexpected response shape from ${endpoint}`);
          continue;
        }
        streams = data;
        break;
      } catch (err) {
        lastError = err;
      }
    }

    if (!streams) {
      throw lastError || new Error("Previous streams could not be loaded");
    }

    if (!container) {
      return;
    }

    container.innerHTML = "";
    if (streams.length === 0) {
      container.innerHTML = '<p style="color:#888">No past streams found.</p>';
      return;
    }
    streams.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    streams.slice(0, 10).forEach((s) => {
      if (!s.playback_id) return;
      const safeTitle = s.title || "Previous Stream";
      const created = new Date(s.created_at);
      const dateLabel = isNaN(created)
        ? ""
        : created.toLocaleDateString(undefined, {
            month: "short",
            day: "numeric",
            year: "numeric",
          });
      const duration = s.duration || "Duration unavailable";
      const viewCount = Number.isFinite(Number(s.views)) ? Number(s.views) : 0;
      const slide = document.createElement("div");
      slide.classList.add("carousel-slide");
      slide.innerHTML = `
        <div class="slide-player">
          <iframe
            src="https://player.mux.com/${s.playback_id}"
            title="${safeTitle}"
            allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
            allowfullscreen
            loading="lazy">
          </iframe>
        </div>
        <div class="slide-info">
          <h3 class="slide-title">${safeTitle}</h3>
          <p class="slide-meta">
            ${dateLabel ? `<span>${dateLabel}</span>` : ""}
            <span>${duration}</span>
            <span>👁️ ${viewCount.toLocaleString()}</span>
          </p>
        </div>`;
      container.appendChild(slide);
    });
  } catch(e){
    console.error(e);
    const fallbackContainer = document.getElementById("archive-carousel");
    if (fallbackContainer) {
      fallbackContainer.innerHTML = '<p style="color:#f66">Unable to load previous streams right now. Please try again later.</p>';
    }
  }
}
loadArchives();

function setupCarouselControls(){
  const container=document.getElementById("archive-carousel");
  const prev=document.querySelector('[data-carousel="prev"]');
  const next=document.querySelector('[data-carousel="next"]');
  if(!container||!prev||!next) return;
  const scrollSize=()=>Math.max(container.clientWidth*0.9,240);
  const updateButtons=()=>{
    const maxScroll=container.scrollWidth-container.clientWidth;
    const atStart=container.scrollLeft<=4;
    const atEnd=container.scrollLeft>=maxScroll-4;
    prev.disabled=atStart||maxScroll<=0;
    next.disabled=atEnd||maxScroll<=0;
  };
  prev.addEventListener("click",()=>{
    container.scrollBy({left:-scrollSize(),behavior:"smooth"});
  });
  next.addEventListener("click",()=>{
    container.scrollBy({left:scrollSize(),behavior:"smooth"});
  });
  container.addEventListener("scroll",updateButtons,{passive:true});
  const observer=new MutationObserver(()=>{
    updateButtons();
  });
  observer.observe(container,{childList:true});
  updateButtons();
}
setupCarouselControls();

/* SUPABASE CHAT */
let currentViewerId = null;

function getViewerProfile() {
  try {
    const cached = localStorage.getItem("supabaseViewerProfile");
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed?.id && parsed?.name) {
        return parsed;
      }
    }
  } catch (err) {
    console.warn("Unable to read Supabase profile from storage", err);
  }

  const profile = {
    id: `viewer-${Math.random().toString(36).slice(2, 10)}`,
    name: `Viewer-${Math.random().toString(36).slice(2, 6)}`,
  };

  try {
    localStorage.setItem("supabaseViewerProfile", JSON.stringify(profile));
  } catch (err) {
    console.warn("Unable to persist Supabase profile", err);
  }

  return profile;
}

function renderMessage(message, messagesEl) {
  const wrapper = document.createElement("div");
  wrapper.classList.add("chat-message");
  if (currentViewerId && message.user_id === currentViewerId) {
    wrapper.classList.add("is-self");
  }
  const meta = document.createElement("div");
  meta.classList.add("chat-meta");
  const author = document.createElement("span");
  author.textContent = message.username || "Anonymous";
  const timestamp = document.createElement("span");
  const created = message.created_at ? new Date(message.created_at) : null;
  timestamp.textContent = created && !isNaN(created)
    ? created.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })
    : "";
  meta.appendChild(author);
  meta.appendChild(timestamp);
  const text = document.createElement("p");
  text.classList.add("chat-text");
  text.textContent = message.message || "";
  wrapper.appendChild(meta);
  wrapper.appendChild(text);
  messagesEl.appendChild(wrapper);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function initSupabaseChat() {
  const chatContainer = document.getElementById("supabase-chat");
  const status = document.getElementById("chat-status");
  const connectionStatus = document.getElementById("chat-connection");
  const messagesEl = document.getElementById("chat-messages");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-input");
  const identityName = document.getElementById("chat-identity-name");
  if (!chatContainer || !messagesEl || !form || !input) return;

  const supabaseUrl = window.SUPABASE_URL || chatContainer.dataset.supabaseUrl || "";
  const supabaseProxyUrl =
    window.SUPABASE_PROXY_URL || chatContainer.dataset.supabaseProxyUrl || "";
  const supabaseAnonKey =
    window.SUPABASE_ANON_KEY ||
    window.SUPABASE_KEY ||
    window.SUPABASE_PUBLISHABLE_KEY ||
    chatContainer.dataset.supabaseAnonKey ||
    "";
  const useProxy = Boolean(supabaseProxyUrl);

  if (!useProxy && (!supabaseUrl || !supabaseAnonKey)) {
    const message = "Add your Supabase URL + anon key to enable live chat.";
    messagesEl.innerHTML = `<div class="chat-status">${message}</div>`;
    if (status) {
      status.textContent = message;
    }
    if (connectionStatus) {
      connectionStatus.textContent = "Offline";
      connectionStatus.dataset.state = "offline";
    }
    return;
  }

  if (!useProxy && !window.supabase) {
    const message = "Chat failed to load. Please try again.";
    messagesEl.innerHTML = `<div class="chat-status">${message}</div>`;
    if (status) {
      status.textContent = message;
    }
    if (connectionStatus) {
      connectionStatus.textContent = "Offline";
      connectionStatus.dataset.state = "offline";
    }
    return;
  }

  const viewerProfile = getViewerProfile();
  currentViewerId = viewerProfile.id;
  if (identityName) {
    identityName.textContent = viewerProfile.name;
  }
  const supabaseClient = useProxy
    ? null
    : window.supabase.createClient(supabaseUrl, supabaseAnonKey);
  if (supabaseClient) {
    window.supabaseChatClient = supabaseClient;
  }

  async function ensureAuthenticated() {
    if (useProxy) {
      return true;
    }
    try {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) {
        console.warn("Supabase auth session error", error);
      }
      if (!data?.session) {
        if (status) {
          status.textContent = "Signing in to chat…";
        }
        if (connectionStatus) {
          connectionStatus.textContent = "Signing in";
          connectionStatus.dataset.state = "connecting";
        }
        const { error: signInError } = await supabaseClient.auth.signInAnonymously();
        if (signInError) {
          console.error("Supabase anonymous sign-in failed", signInError);
          if (status) {
            status.textContent = "Chat sign-in failed. Please try again.";
          }
          if (connectionStatus) {
            connectionStatus.textContent = "Offline";
            connectionStatus.dataset.state = "offline";
          }
          return false;
        }
      }
      return true;
    } catch (err) {
      console.error("Supabase auth exception", err);
      if (status) {
        status.textContent = "Chat sign-in failed. Please try again.";
      }
      if (connectionStatus) {
        connectionStatus.textContent = "Offline";
        connectionStatus.dataset.state = "offline";
      }
      return false;
    }
  }

  let lastSeenCreatedAt = null;
  const seenFingerprints = new Set();

  function fingerprintMessage(m) {
    return [m.created_at || "", m.user_id || "", m.username || "", m.message || ""].join("|");
  }

  async function loadMessages({ incremental = false } = {}) {
    let data = null;
    let loadError = null;
    try {
      if (useProxy) {
        const url = new URL(supabaseProxyUrl, window.location.origin);
        if (incremental && lastSeenCreatedAt) {
          url.searchParams.set("since", lastSeenCreatedAt);
        }
        const response = await fetch(url.toString(), {
          method: "GET",
          headers: { Accept: "application/json" },
          cache: "no-store",
        });
        if (!response.ok) {
          throw new Error(`Proxy request failed: ${response.status}`);
        }
        const payload = await response.json();
        if (!Array.isArray(payload)) {
          throw new Error("Proxy returned unexpected response");
        }
        data = payload;
      } else {
        const result = await supabaseClient
          .from("messages")
          .select("*")
          .order("created_at", { ascending: true })
          .limit(200);
        data = result.data;
        loadError = result.error;
      }
    } catch (err) {
      loadError = err;
    }
    if (loadError) {
      console.error("Supabase chat load failed", loadError);
      messagesEl.innerHTML = '<div class="chat-status">Unable to load chat history.</div>';
      if (connectionStatus) {
        connectionStatus.textContent = "Offline";
        connectionStatus.dataset.state = "offline";
      }
      return;
    }

    // First load replaces contents; incremental load appends only new messages.
    if (!incremental) {
      messagesEl.innerHTML = "";
      seenFingerprints.clear();
      if (data.length === 0) {
        messagesEl.innerHTML = '<div class="chat-status">Be the first to say hello.</div>';
      }
    }

    if (Array.isArray(data) && data.length) {
      data.forEach((message) => {
        const fp = fingerprintMessage(message);
        if (seenFingerprints.has(fp)) return;
        seenFingerprints.add(fp);
        renderMessage(message, messagesEl);
      });

      const newest = data[data.length - 1];
      if (newest?.created_at) {
        lastSeenCreatedAt = newest.created_at;
      }
    }

    if (status) status.textContent = "";
    if (connectionStatus) {
      connectionStatus.textContent = "Live";
      connectionStatus.dataset.state = "live";
    }
  }

  const authed = await ensureAuthenticated();
  if (!authed) {
    return;
  }

  await loadMessages({ incremental: false });

  let pollIntervalId = null;
  let channel = null;
  if (useProxy) {
    const poll = () => {
      // Avoid background-tab polling (reduces server + battery load)
      if (document.visibilityState !== "visible") return;
      loadMessages({ incremental: true });
    };
    pollIntervalId = window.setInterval(poll, 10000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        // quick refresh when returning to the tab
        loadMessages({ incremental: true });
      }
    });
  } else {
    channel = supabaseClient
      .channel("public:messages")
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "messages" },
        (payload) => {
          if (payload?.new) {
            if (messagesEl.querySelector(".chat-status")) {
              messagesEl.innerHTML = "";
            }
            renderMessage(payload.new, messagesEl);
          }
        }
      )
      .subscribe((channelStatus) => {
        if (status && channelStatus === "SUBSCRIBED") {
          status.textContent = "";
        }
        if (connectionStatus && channelStatus === "SUBSCRIBED") {
          connectionStatus.textContent = "Live";
          connectionStatus.dataset.state = "live";
        }
      });
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    input.disabled = true;
    try {
      const ready = await ensureAuthenticated();
      if (!ready) {
        return;
      }
      let sendError = null;
      if (useProxy) {
        const response = await fetch(supabaseProxyUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: viewerProfile.id,
            username: viewerProfile.name,
            message,
          }),
        });
        if (!response.ok) {
          sendError = new Error(`Proxy send failed: ${response.status}`);
        }
      } else {
        const { error } = await supabaseClient.from("messages").insert({
          user_id: viewerProfile.id,
          username: viewerProfile.name,
          message,
        });
        sendError = error;
      }
      if (sendError) {
        console.error("Supabase chat send failed", sendError);
        if (status) status.textContent = "Unable to send message.";
        if (connectionStatus) {
          connectionStatus.textContent = "Offline";
          connectionStatus.dataset.state = "offline";
        }
      }
    } catch (err) {
      console.error("Supabase chat send exception", err);
      if (status) status.textContent = "Unable to send message.";
      if (connectionStatus) {
        connectionStatus.textContent = "Offline";
        connectionStatus.dataset.state = "offline";
      }
    } finally {
      input.disabled = false;
      input.focus();
    }
  });

  window.addEventListener("beforeunload", () => {
    if (pollIntervalId) {
      window.clearInterval(pollIntervalId);
    }
    if (supabaseClient && channel) {
      supabaseClient.removeChannel(channel);
    }
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initSupabaseChat);
} else {
  initSupabaseChat();
}

/* STARS */
function createStars(layerId,count,sizeRange,travelRange,driftDurationRange,twinkleRange){
  const layer=document.getElementById(layerId);
  if(!layer) return;
  layer.style.animationDuration=`${60+Math.random()*30}s`;
  layer.style.animationDelay=`-${Math.random()*30}s`;
  for(let i=0;i<count;i++){
    const s=document.createElement("div");
    s.classList.add("star");
    const size=Math.random()*(sizeRange[1]-sizeRange[0])+sizeRange[0];
    s.style.width=`${size}px`;
    s.style.height=`${size}px`;
    s.style.top=`${Math.random()*100}%`;
    s.style.left=`${Math.random()*100}%`;

    const scale=(0.7+Math.random()*0.6).toFixed(2);
    const scaleStart=(scale*0.85).toFixed(2);
    const scaleMid=(scale*1.05).toFixed(2);
    const angle=Math.random()*Math.PI*2;
    const travel=Math.random()*(travelRange[1]-travelRange[0])+travelRange[0];
    const depth=(Math.random()-0.5)*travel*0.3;
    const driftDuration=(Math.random()*(driftDurationRange[1]-driftDurationRange[0])+driftDurationRange[0]).toFixed(2);
    const twinkleDuration=(Math.random()*(twinkleRange[1]-twinkleRange[0])+twinkleRange[0]).toFixed(2);

    s.style.setProperty("--scale-base",scale);
    s.style.setProperty("--scale-start",scaleStart);
    s.style.setProperty("--scale-mid",scaleMid);
    s.style.setProperty("--drift-x",`${Math.cos(angle)*travel}px`);
    s.style.setProperty("--drift-y",`${Math.sin(angle)*travel}px`);
    s.style.setProperty("--drift-z",`${depth}px`);
    s.style.setProperty("--drift-duration",`${driftDuration}s`);
    s.style.setProperty("--drift-delay",`-${(Math.random()*driftDurationRange[1]).toFixed(2)}s`);
    s.style.setProperty("--twinkle-duration",`${twinkleDuration}s`);
    s.style.setProperty("--twinkle-delay",`-${(Math.random()*6).toFixed(2)}s`);

    layer.appendChild(s);
  }
}
const starStyle=document.createElement("style");
starStyle.innerHTML=`
@keyframes twinkle {
  0%, 100% { opacity: 0.3; filter: drop-shadow(0 0 2px rgba(0, 140, 255, 0.45)); }
  45% { opacity: 1; filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.95)); }
  55% { opacity: 0.85; filter: drop-shadow(0 0 6px rgba(0, 210, 255, 0.7)); }
}
@keyframes drift {
  0% { transform: translate3d(0, 0, 0) scale(var(--scale-start)); }
  50% { transform: translate3d(calc(var(--drift-x) * 0.5), calc(var(--drift-y) * 0.5), calc(var(--drift-z) * 0.5)) scale(var(--scale-mid)); }
  100% { transform: translate3d(var(--drift-x), var(--drift-y), var(--drift-z)) scale(var(--scale-base)); }
}
@keyframes layerPulse {
  0%, 100% { --pulse-translate: 0px; --pulse-scale: 1; }
  50% { --pulse-translate: -12px; --pulse-scale: 1.03; }
}
`;
document.head.appendChild(starStyle);
const isMobile = window.matchMedia && window.matchMedia("(max-width: 900px)").matches;
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

if (!reduceMotion) {
  // Slightly lighter starfield on mobile to keep scrolling smooth.
  createStars("layer1", isMobile ? 90 : 140, [1,2], [80,160], [90,140], [4,7]);
  createStars("layer2", isMobile ? 60 : 95, [2,3], [140,240], [120,180], [5,8]);
  createStars("layer3", isMobile ? 40 : 65, [3,4], [200,320], [160,220], [6,9]);
}
document.addEventListener("mousemove",(e)=>{
  const x=e.clientX/window.innerWidth-0.5;
  const y=e.clientY/window.innerHeight-0.5;
  const layer1=document.getElementById("layer1");
  const layer2=document.getElementById("layer2");
  const layer3=document.getElementById("layer3");
  layer1?.style.setProperty("--offset-x",`${x*10}px`);
  layer1?.style.setProperty("--offset-y",`${y*10}px`);
  layer2?.style.setProperty("--offset-x",`${x*20}px`);
  layer2?.style.setProperty("--offset-y",`${y*20}px`);
  layer3?.style.setProperty("--offset-x",`${x*40}px`);
  layer3?.style.setProperty("--offset-y",`${y*40}px`);
});
</script>
