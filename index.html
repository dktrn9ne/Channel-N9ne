nt:center;align-items:stretch;} .n9ne-btn {flex:0 1 clamp(100px,18vw,180px);display:flex;align-items:center;justify-content:center;cursor:pointer;perspective:600px;} .n9ne-btn img {width:100%;transition:transform .25s ease,filter .25s ease;transform:rotateX(14deg);filter:drop-shadow(0 0 4px rgba(0,191,255,.8));} .n9ne-btn img:hover {transform:rotateX(0) rotateY(10deg) translateZ(4px) scale(1.12);filter:drop-shadow(0 0 12px rgba(0,255,255,1));}.n9ne-btn img.live{animation:pulseGlow 2.5s ease-in-out infinite;}@keyframes pulseGlow {0%,100%{filter:drop-shadow(0 0 2px rgba(0,255,255,.6));}50%{filter:drop-shadow(0 0 8px rgba(0,255,255,1));}} #chat {flex:1.2 1 320px;display:flex;flex-direction:column;border:1px solid rgba(0,255,255,.18);border-radius:12px;background:rgba(0,0,0,.35);padding:16px;gap:12px;max-height:80vh;min-height:320px;} #chat-header {display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#00c7ff;border-bottom:1px solid rgba(0,255,255,.15);padding-bottom:8px;} #chat-status {font-size:.85rem;min-height:1.2em;color:#9dd7ff;} #chat-status.success {color:#73ffd6;} #chat-status.error {color:#ff8a9a;} #chat-box {flex:1;overflow-y:auto;border:1px solid rgba(0,255,255,.1);border-radius:8px;padding:12px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 20px rgba(0,0,0,.35);} .chat-empty {text-align:center;color:#9db3bf;font-style:italic;margin:12px 0;} .msg {display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;line-height:1.4;} .msg .user {font-weight:700;color:#00ffff;} .msg .time {margin-left:auto;font-size:.75rem;color:#7aa0b6;} #chat-inputs {display:flex;gap:8px;} #chat-inputs input {flex:1;border:none;border-radius:6px;background:#0d1a24;color:#fff;padding:10px;} #chat-inputs button {border:none;border-radius:6px;background:#00c7ff;color:#00131f;font-weight:700;padding:10px 16px;cursor:pointer;transition:background .2s ease,transform .2s ease;} #chat-inputs button:hover:not(:disabled) {background:#00f7ff;transform:translateY(-1px);} e" hidden><button id="close-modal" type="button" aria-label="Close replay">✖</button><div class="mux-player-container" style="width:min(900px,90vw)"><mux-player id="archive-player" stream-type="on-demand" primary-color="#00c7ff" metadata-video-title="Previous Stream" playsinline controls></mux-player></div></div><script> document.addEventListener("DOMContentLoaded",()=>{ const archiveCarousel=document.getElementById("archive-carousel"); const archiveModal=document.getElementById("playback-modal"); const archivePlayer=document.getElementById("archive-player"); const closeModal=document.getElementById("close-modal"); const chatBox=document.getElementById("chat-box"); const chatStatus=document.getElementById("chat-status"); const viewerCount=document.getElementById("viewer-count"); const usernameInput=document.getElementById("username"); const messageInput=document.getElementById("msg"); const sendButton=document.getElementById("send"); function setStatus(message,tone){chatStatus.textContent=message;chatStatus.classList.remove("success","error");if(tone)chatStatus.classList.add(tone);} function setViewerLabel(text){viewerCount.textContent=text;} function renderEmptyChat(){chatBox.innerHTML='<p class="chat-empty">Be the first to say hello ✨</p>';chatBox.dataset.empty="true";} function clearEmptyChat(){if(chatBox.dataset.empty){chatBox.innerHTML="";delete chatBox.dataset.empty;}} function appendMessage({username,text,created_at}){clearEmptyChat();const row=document.createElement("div");row.className="msg";const nameSpan=document.createElement("span");nameSpan.className="user";nameSpan.textContent=(username||"Guest").slice(0,24);const textSpan=document.createElement("span");textSpan.className="message-text";textSpan.textContent=text||"";const timeSpan=document.createElement("span");timeSpan.className="time";const when=created_at?new Date(created_at):new Date();if(!Number.isNaN(when.getTime())){timeSpan.textContent=when.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});}row.append(nameSpan,document.createTextNode(": "),textSpan,timeSpan);chatBox.appendChild(row);chatBox.scrollTop=chatBox.scrollHeight;} async function loadArchives(){if(!archiveCarousel)return;const defaultEndpoint="https://channeln9ne.xyz/api/get-mux-streams";const fallback=typeof window!="undefined"&&window.location?.origin?`${window.location.origin}/api/get-mux-streams`:defaultEndpoint;try{let response=await fetch(fallback);if(!response.ok){response=await fetch(defaultEndpoint);}if(!response.ok)throw new Error(`Failed to load streams (${response.status})`);const streams=await response.json();archiveCarousel.innerHTML="";if(!Array.isArray(streams)||streams.length===0){archiveCarousel.innerHTML='<p class="chat-empty" role="status">No past streams yet.</p>';return;}streams.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).forEach(stream=>{const card=document.createElement("article");card.className="archive-card";card.setAttribute("role","listitem");const safeTitle=stream.title||"Previous Stream";const createdAt=stream.created_at?new Date(stream.created_at):null;const dateLabel=createdAt&&!Number.isNaN(createdAt.getTime())?createdAt.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"";card.innerHTML=`<img src="${stream.thumbnail_url}" alt="${safeTitle}"/><div class="watch-overlay">▶ Watch replay</div><div class="archive-meta"><span>${safeTitle}${dateLabel?` — ${dateLabel}`:""}</span></div><div class="archive-meta"><span>${stream.duration||"—"}</span><span>👁️ ${stream.views||0}</span></div>`;card.addEventListener("click",()=>openReplay(stream.playback_id,safeTitle));archiveCarousel.appendChild(card);});}catch(error){console.error(error);archiveCarousel.innerHTML='<p class="chat-empty" role="alert">Unable to load previous streams.</p>';}} function openReplay(playbackId,title){if(!archiveModal||!archivePlayer)return;archivePlayer.setAttribute("playback-id",playbackId||"");archivePlayer.setAttribute("metadata-video-title",title||"Previous Stream");archiveModal.hidden=false;document.body.style.overflow="hidden";} function closeReplay(){archiveModal.hidden=true;document.body.style.overflow="";archivePlayer.pause?.();} closeModal.addEventListener("click",closeReplay);archiveModal.addEventListener("click",event=>{if(event.target===archiveModal)closeReplay();}); const SUPABASE_URL="https://kidmxnxkhyhaehzexatm.supabase.co";const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpZG14bnhraHloYWVoemV4YXRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5MTI3NjYsImV4cCI6MjA3NzQ4ODc2Nn0.JyyK2yYLP3WX4QIxnJcH_f4KNuDlaJ-e0ZKb07uJS_U"; const supabaseClient=typeof window.supabase?.createClient==="function"?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null; let isConnected=false;let isSending=false; function updateSendState(){const hasText=messageInput.value.trim().length>0;sendButton.disabled=!isConnected||!hasText||isSending;} messageInput.addEventListener("input",updateSendState); usernameInput.addEventListener("input",()=>{usernameInput.value=usernameInput.value.replace(/\s+/g," ").trimStart();}); async function loadMessages(){if(!supabaseClient)return;const {data,error}=await supabaseClient.from("messages").select("*").order("created_at",{ascending:true}).limit(100);if(error)throw error;chatBox.innerHTML="";if(!data||data.length===0){renderEmptyChat();return;}data.forEach(appendMessage);} async function sendMessage(){const text=messageInput.value.trim();if(!text||!isConnected||isSending||!supabaseClient)return;isSending=true;updateSendState();try{const payload={username:(usernameInput.value||"Guest").slice(0,24),text:text.slice(0,280)};const {error}=await supabaseClient.from("messages").insert([payload]);if(error)throw error;messageInput.value="";}catch(err){console.error("send failed",err);setStatus("Message failed to send.","error");setTimeout(()=>setStatus(isConnected?"Connected. Say hello!":"Chat offline.",isConnected?"success":"error"),2500);}finally{isSending=false;updateSendState();}} sendButton.addEventListener("click",sendMessage); messageInput.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();sendMessage();}}); renderEmptyChat();updateSendState(); if(!supabaseClient){setStatus("Chat offline. Please refresh to try again.","error");setViewerLabel("Offline");} else{ setStatus("Connecting…");setViewerLabel("Connecting…"); loadMessages().catch(err=>{console.error(err);setStatus("Unable to load chat history.","error");}); const channel=supabaseClient.channel("public:messages").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>appendMessage(payload.new)); channel.subscribe(status=>{if(status==="SUBSCRIBED"){isConnected=true;setStatus("Connected. Say hello!","success");setViewerLabel("Chat online");loadMessages().catch(console.error);}else if(status==="TIMED_OUT"||status==="CHANNEL_ERROR"){isConnected=false;setStatus("Reconnecting…","error");setViewerLabel("Reconnecting…");}else if(status==="CLOSED"){isConnected=false;setStatus("Chat offline.","error");setViewerLabel("Offline");}updateSendState();}).catch(err=>{console.error("subscription failed",err);isConnected=false;setStatus("Chat offline.","error");setViewerLabel("Offline");updateSendState();}); } function createStars(id,count,sizeRange,travelRange,durationRange,twinkleRange){const layer=document.getElementById(id);if(!layer)return;layer.innerHTML="";layer.style.animationDuration=`${60+Math.random()*30}s`;layer.style.animationDelay=`-${Math.random()*45}s`;for(let i=0;i<count;i+=1){const star=document.createElement("div");star.className="star";const size=Math.random()*(sizeRange[1]-sizeRange[0])+sizeRange[0];star.style.width=`${size}px`;star.style.height=`${size}px`;star.style.top=`${Math.random()*100}%`;star.style.left=`${Math.random()*100}%`;const scale=0.7+Math.random()*0.6;const travel=Math.random()*(travelRange[1]-travelRange[0])+travelRange[0];const depth=(Math.random()-.5)*travel*.3;const angle=Math.random()*Math.PI*2;const driftDuration=Math.random()*(durationRange[1]-durationRange[0])+durationRange[0];const twinkle=Math.random()*(twinkleRange[1]-twinkleRange[0])+twinkleRange[0];star.style.setProperty("--scale-base",scale.toFixed(2));star.style.setProperty("--scale-start",(scale*0.86).toFixed(2));star.style.setProperty("--scale-mid",(scale*1.04).toFixed(2));star.style.setProperty("--drift-x",`${Math.cos(angle)*travel}px`);star.style.setProperty("--drift-y",`${Math.sin(angle)*travel}px`);star.style.setProperty("--drift-z",`${depth}px`);star.style.setProperty("--drift-duration",`${driftDuration.toFixed(2)}s`);star.style.setProperty("--drift-delay",`-${(Math.random()*durationRange[1]).toFixed(2)}s`);star.style.setProperty("--twinkle-duration",`${twinkle.toFixed(2)}s`);star.style.setProperty("--twinkle-delay",`-${(Math.random()*6).toFixed(2)}s`);layer.appendChild(star);}} createStars("layer1",140,[1,2],[80,150],[90,140],[4,7]); createStars("layer2",95,[2,3],[140,240],[120,180],[5,8]); createStars("layer3",65,[3,4],[220,340],[150,220],[6,9]); document.addEventListener("mousemove",event=>{const x=event.clientX/window.innerWidth-.5;const y=event.clientY/window.innerHeight-.5;document.getElementById("layer1")?.style.setProperty("--offset-x",`${x*10}px`);document.getElementById("layer1")?.style.setProperty("--offset-y",`${y*10}px`);document.getElementById("layer2")?.style.setProperty("--offset-x",`${x*20}px`);document.getElementById("layer2")?.style.setProperty("--offset-y",`${y*20}px`);document.getElementById("layer3")?.style.setProperty("--offset-x",`${x*38}px`);document.getElementById("layer3")?.style.setProperty("--offset-y",`${y*38}px`);}); loadArchives(); }); </script></body></html>
