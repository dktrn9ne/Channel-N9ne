logLevel: info
logDestinations: [stdout]

authMethod: internal
authInternalUsers:
  - user: n9ne-publisher
    pass: CHANGE_ME
    permissions:
      - action: publish
        path: n9ne
  - user: any
    permissions:
      - action: read
        path: n9ne
  - user: any
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof

rtmp: true
rtmpAddress: :1935

hls: true
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentCount: 7

webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]

api: true
apiAddress: :9997
metrics: true
metricsAddress: :9998

pathDefaults:
  source: publisher
  overridePublisher: false
  record: true
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordDeleteAfter: 30d

paths:
  n9ne:

