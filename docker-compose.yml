services:
  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: "${STREAM_PUBLISH_PASSWORD:?Set STREAM_PUBLISH_PASSWORD in .env}"
      MTX_WEBRTCADDITIONALHOSTS: "${STREAM_PUBLIC_HOST:-localhost}"
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    volumes:
      - ./streaming/mediamtx.yml:/mediamtx.yml:ro
      - ./streaming/recordings:/recordings

